[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-cross-fork-conformance"
version = "0.1.0"
description = "Reference-safe comparison and selection tools for the cross-fork llama.cpp conformance suite"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llama-conformance = "llama_conformance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
