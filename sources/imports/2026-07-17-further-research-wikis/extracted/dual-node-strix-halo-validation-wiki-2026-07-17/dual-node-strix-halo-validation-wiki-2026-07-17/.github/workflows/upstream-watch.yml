name: Upstream watch discovery
on:
  schedule:
    # Avoid the top of the hour; GitHub documents that scheduled runs can be delayed.
    - cron: '17 7,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Restore discovery state
        uses: actions/cache/restore@v4
        with:
          path: .upstream-watch-state
          key: upstream-watch-${{ github.run_id }}
          restore-keys: upstream-watch-
      - name: Poll primary sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .upstream-watch-state run-output
          python tools/upstream_watch.py \
            --state .upstream-watch-state/watch-state.json \
            --ledger .upstream-watch-state/events.jsonl \
            --report run-output/watch-report.json
          cp .upstream-watch-state/events.jsonl run-output/events.jsonl 2>/dev/null || true
      - name: Evaluate freshness and blockers
        continue-on-error: true
        run: |
          python tools/check_upstream_freshness.py \
            --state .upstream-watch-state/watch-state.json \
            --ledger .upstream-watch-state/events.jsonl \
            --output run-output/freshness-report.json
      - name: Save discovery state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .upstream-watch-state
          key: upstream-watch-${{ github.run_id }}
      - name: Publish auditable run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-watch-${{ github.run_id }}
          path: run-output/
          retention-days: 90
      - name: Job summary
        if: always()
        run: |
          echo '## Upstream watch' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact is discovery evidence only. Copy the normalized ledger to the project’s protected evidence store and triage every P0/P1 event.' >> "$GITHUB_STEP_SUMMARY"
