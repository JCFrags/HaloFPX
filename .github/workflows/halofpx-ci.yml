name: HaloFPX validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halofpx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki:
    name: Wiki structure and validator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The publication validator verifies both imported ancestors and the
          # exact two-parent integration boundary.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements/requirements-halofpx-validation.txt
          python -m pip install --disable-pip-version-check --require-hashes \
            -r project/project-management/documentation/github-wiki-mirror-requirements.txt

      - name: Check generated wiki manifest
        working-directory: project
        run: python research/prompts/tools/generate_wiki_manifest.py wiki/HaloFPX_Wiki --check

      - name: Validate wiki structure
        working-directory: project
        run: python research/prompts/tools/validate_wiki.py wiki/HaloFPX_Wiki

      - name: Verify deterministic GitHub Wiki convenience mirror
        run: >-
          python project/project-management/documentation/github_wiki_mirror.py
          --repo . verify --source-ref "$(git rev-parse HEAD)"

      - name: Run GitHub Wiki mirror contract tests
        run: >-
          python -m unittest
          project/project-management/documentation/test_github_wiki_mirror.py
          -v

      - name: Run validator unit tests
        working-directory: project
        run: python -m unittest discover -s research/prompts/tools -p 'test_*.py' -v

      - name: Run model-general Strix harness and maintenance tests
        run: >-
          python -m unittest
          tests/test_halofpx_strix_ab.py
          tests/test_halofpx_strix_ab_sampling_sync.py
          tests/test_halofpx_strix_ab_cachyos.py
          tests/test_halofpx_strix_maintenance.py
          tests/test_halofpx_strix_recovery_watchdog.py
          tests/test_halofpx_strix_nonce_protocol.py
          tests/test_halofpx_strix_hmm_admission.py
          -v

      - name: Run portable ROCmFPX fixture tests
        run: python -B tests/test_materialize_rocmfpx_fixture.py -v

      - name: Run fresh-PC recovery offline contract tests
        run: python -B tests/test_halofpx_fresh_pc_recovery.py -v

      - name: Run fresh-clone publication manifest identity regression
        shell: pwsh
        run: ./tests/test-verify-publication-assets-fresh-clone-manifest-identity.ps1

      - name: Validate publication documentation and protected provenance
        run: python project/project-management/documentation/validate_documentation.py

      - name: Validate target HMM OOM incident bundle
        shell: pwsh
        run: ./docs/halofpx/evidence/2026-08-12-target-hmm-oom-incident/validate.ps1

      - name: Run target HMM OOM incident validator contract tests
        shell: pwsh
        run: ./tests/test-halofpx-target-hmm-oom-incident.ps1

  incident-collector-contract:
    name: Windows incident collector containment contract
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run collector Job Object self-test
        shell: pwsh
        run: ./docs/halofpx/evidence/2026-08-12-target-hmm-oom-incident/collect-read-only.ps1 -SelfTest

  feature-off-build:
    name: Feature-off static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure feature-off build
        run: >-
          cmake -S . -B build/ci-feature-off
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_RPC=OFF
          -DGGML_RPC_HALOFPX_LOCAL_STATE=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF

      - name: Compile core library
        run: cmake --build build/ci-feature-off --target llama --parallel 2

  prefill-phase-profile-test:
    name: CPU llama-bench prefill profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HALOFPX_MODEL_COMMIT: 499bc8821c6b12b4e53c5bffcb21ec206f212d81
      HALOFPX_MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      HALOFPX_CANARY_MODEL: ${{ github.workspace }}/build/fixtures/stories15M-q4_0.gguf
      HALOFPX_LLAMA_BENCH_BIN: ${{ github.workspace }}/build/ci-prefill-profile/bin/llama-bench
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Configure focused CPU llama-bench build
        run: >-
          cmake -S . -B build/ci-prefill-profile
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_VULKAN=OFF
          -DGGML_RPC=ON
          -DGGML_RPC_HALOFPX_LOCAL_STATE=ON
          -DLLAMA_BUILD_COMMON=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_USE_PREBUILT_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF

      - name: Compile llama-bench
        run: cmake --build build/ci-prefill-profile --target llama-bench --parallel 2

      - name: Download and verify pinned tiny model fixture
        # Test-only, checksum-pinned external fixture; it is not redistributed.
        run: |
          mkdir -p build/fixtures
          curl --fail --location --retry 3 --retry-all-errors \
            --max-filesize 19077344 \
            --proto '=https' --proto-redir '=https' \
            --output "$HALOFPX_CANARY_MODEL" \
            "https://huggingface.co/ggml-org/models-moved/resolve/${HALOFPX_MODEL_COMMIT}/tinyllamas/stories15M-q4_0.gguf?download=true"
          echo "${HALOFPX_MODEL_SHA256}  ${HALOFPX_CANARY_MODEL}" | sha256sum --check -

      - name: Run repetition, schema, and feature-off checks
        run: python tests/test_llama_bench_prefill_phase_profile.py -v

  sampling-sync-coalesce-test:
    name: CPU sampling synchronization canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HALOFPX_MODEL_COMMIT: 499bc8821c6b12b4e53c5bffcb21ec206f212d81
      HALOFPX_MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      HALOFPX_CANARY_MODEL: ${{ github.workspace }}/build/fixtures/stories15M-q4_0.gguf
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure sampling canary build
        run: >-
          cmake -S . -B build/ci-sampling-sync
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_VULKAN=OFF
          -DGGML_RPC=ON
          -DGGML_RPC_HALOFPX_LOCAL_STATE=ON
          -DLLAMA_BUILD_COMMON=ON
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_USE_PREBUILT_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF
          -DHALOFPX_SAMPLING_SYNC_COALESCE_CANARY=ON

      - name: Compile canary, server, and focused tests
        run: >-
          cmake --build build/ci-sampling-sync
          --target
          llama-server
          test-halofpx-sampling-sync-coalesce
          test-server-sampling-sync-metrics
          test-halofpx-output-row
          test-backend-sampler
          --parallel 2

      - name: Run synchronization, metrics, and row contracts
        run: >-
          ctest --test-dir build/ci-sampling-sync
          --output-on-failure
          -R '^(test-halofpx-sampling-sync-coalesce|test-halofpx-sampling-sync-metrics-contract|test-server-sampling-sync-metrics|test-halofpx-output-row)$'

      - name: Download and verify pinned tiny model fixture
        # Test-only, checksum-pinned external fixture; it is not redistributed.
        run: |
          mkdir -p build/fixtures
          curl --fail --location --retry 3 --retry-all-errors \
            --max-filesize 19077344 \
            --proto '=https' --proto-redir '=https' \
            --output "$HALOFPX_CANARY_MODEL" \
            "https://huggingface.co/ggml-org/models-moved/resolve/${HALOFPX_MODEL_COMMIT}/tinyllamas/stories15M-q4_0.gguf?download=true"
          echo "${HALOFPX_MODEL_SHA256}  ${HALOFPX_CANARY_MODEL}" | sha256sum --check -

      - name: Run backend-row post-sampling probability regression
        run: |
          build/ci-sampling-sync/bin/test-backend-sampler \
            --model "$HALOFPX_CANARY_MODEL" \
            --device cpu \
            --test greedy
          build/ci-sampling-sync/bin/test-backend-sampler \
            --model "$HALOFPX_CANARY_MODEL" \
            --device cpu \
            --test cpu_mixed

