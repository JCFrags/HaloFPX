  rocmfpx-qkv-reuse-composition-hip-compile:
    name: ROCmFPX prompt, n=1 QKV, and routed-MoE reuse gfx1151 composition compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: docker.io/rocm/dev-ubuntu-24.04@sha256:bdc8e61026cbb844ede93d44d2c50055f51ebb2041906b60182bf3bee3139054
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        mode: ["off", "on"]
    steps:
      - name: Install bounded build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git hipblas-dev ninja-build python3 rocblas-dev
          rm -rf /var/lib/apt/lists/*

      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure composed gfx1151 HIP backend
        env:
          COMPOSE_MODE: ${{ matrix.mode }}
        run: |
          if [[ "${COMPOSE_MODE}" = on ]]; then option=ON; else option=OFF; fi
          cmake -S . -B build/ci-rocmfpx-qkv-compose-${COMPOSE_MODE} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_HIP_COMPILER=/opt/rocm/lib/llvm/bin/clang++ \
            -DCMAKE_HIP_ARCHITECTURES=gfx1151 \
            -DGPU_TARGETS=gfx1151 \
            -DGGML_CUDA=OFF \
            -DGGML_HIP=ON \
            -DGGML_HIP_ROCMFPX_QKV_Q8_REUSE="${option}" \
            -DGGML_HIP_ROCMFPX_MMVQ_QKV_Q8_REUSE="${option}" \
            -DGGML_HIP_ROCMFPX_MOE_Q8_REUSE="${option}" \
            -DGGML_HIP_ROCMFPX_FFN_Q8_REUSE=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_RPC=OFF \
            -DGGML_VULKAN=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_WEBUI=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF

      - name: Compile and link the composed HIP backend
        run: >-
          cmake --build build/ci-rocmfpx-qkv-compose-${{ matrix.mode }}
          --target ggml-hip
          --parallel 1

      - name: Verify composed feature-off/on macro and architecture contract
        env:
          COMPOSE_MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          mode = os.environ["COMPOSE_MODE"]
          build_dir = Path(f"build/ci-rocmfpx-qkv-compose-{mode}")
          entries = json.loads((build_dir / "compile_commands.json").read_text())
          macros = (
              "-DGGML_HIP_ROCMFPX_QKV_Q8_REUSE",
              "-DGGML_HIP_ROCMFPX_MMVQ_QKV_Q8_REUSE",
              "-DGGML_HIP_ROCMFPX_MOE_Q8_REUSE",
          )
          for suffix in (
              "/ggml/src/ggml-cuda/ggml-cuda.cu",
              "/ggml/src/ggml-cuda/mmq.cu",
              "/ggml/src/ggml-cuda/mmvq.cu",
          ):
              matches = [entry for entry in entries if entry["file"].replace("\\", "/").endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(f"expected one compile command for {suffix}, found {len(matches)}")
              command = matches[0].get("command") or " ".join(matches[0]["arguments"])
              if "--offload-arch=gfx1151" not in command:
                  raise SystemExit(f"gfx1151 architecture flag missing from {suffix}")
              for macro in macros:
                  if mode == "on" and macro not in command:
                      raise SystemExit(f"{macro} missing from feature-on {suffix}")
                  if mode == "off" and macro in command:
                      raise SystemExit(f"{macro} unexpectedly present in feature-off {suffix}")
          PY
          find build/ci-rocmfpx-qkv-compose-${COMPOSE_MODE} -name 'libggml-hip.so*' -print -quit | grep -q .
