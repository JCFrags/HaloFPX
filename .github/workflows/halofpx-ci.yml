name: HaloFPX validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halofpx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki:
    name: Wiki structure and validator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The publication validator verifies both imported ancestors and the
          # exact two-parent integration boundary.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Check generated wiki manifest
        working-directory: project
        run: python research/prompts/tools/generate_wiki_manifest.py wiki/HaloFPX_Wiki --check

      - name: Validate wiki structure
        working-directory: project
        run: python research/prompts/tools/validate_wiki.py wiki/HaloFPX_Wiki

      - name: Run validator unit tests
        working-directory: project
        run: python -m unittest discover -s research/prompts/tools -p 'test_*.py' -v

      - name: Run model-general Strix A/B harness tests
        run: python tests/test_halofpx_strix_ab.py -v

      - name: Validate publication documentation and protected provenance
        run: python project/project-management/documentation/validate_documentation.py

  feature-off-build:
    name: Feature-off static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure feature-off build
        run: >-
          cmake -S . -B build/ci-feature-off
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_RPC=OFF
          -DGGML_RPC_HALOFPX_LOCAL_STATE=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF

      - name: Compile core library
        run: cmake --build build/ci-feature-off --target llama --parallel 2

  prefill-phase-profile-test:
    name: CPU llama-bench prefill profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HALOFPX_MODEL_COMMIT: 499bc8821c6b12b4e53c5bffcb21ec206f212d81
      HALOFPX_MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      HALOFPX_CANARY_MODEL: ${{ github.workspace }}/build/fixtures/stories15M-q4_0.gguf
      HALOFPX_LLAMA_BENCH_BIN: ${{ github.workspace }}/build/ci-prefill-profile/bin/llama-bench
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Configure focused CPU llama-bench build
        run: >-
          cmake -S . -B build/ci-prefill-profile
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_VULKAN=OFF
          -DGGML_RPC=ON
          -DGGML_RPC_HALOFPX_LOCAL_STATE=ON
          -DLLAMA_BUILD_COMMON=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_USE_PREBUILT_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF

      - name: Compile llama-bench
        run: cmake --build build/ci-prefill-profile --target llama-bench --parallel 2

      - name: Download and verify pinned tiny model fixture
        # Test-only, checksum-pinned external fixture; it is not redistributed.
        run: |
          mkdir -p build/fixtures
          curl --fail --location --retry 3 --retry-all-errors \
            --max-filesize 19077344 \
            --proto '=https' --proto-redir '=https' \
            --output "$HALOFPX_CANARY_MODEL" \
            "https://huggingface.co/ggml-org/models-moved/resolve/${HALOFPX_MODEL_COMMIT}/tinyllamas/stories15M-q4_0.gguf?download=true"
          echo "${HALOFPX_MODEL_SHA256}  ${HALOFPX_CANARY_MODEL}" | sha256sum --check -

      - name: Run repetition, schema, and feature-off checks
        run: python tests/test_llama_bench_prefill_phase_profile.py -v

  loader-partition-test:
    name: CPU loader-partition recovery seam
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure focused CPU test build
        run: >-
          cmake -S . -B build/ci-loader-partition
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_RPC=ON
          -DGGML_RPC_HALOFPX_LOCAL_STATE=ON
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_USE_PREBUILT_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF

      - name: Compile loader-partition test
        run: >-
          cmake --build build/ci-loader-partition
          --target test-halofpx-loader-partition
          --parallel 2

      - name: Run exact loader-partition CTest
        run: >-
          ctest --test-dir build/ci-loader-partition
          --output-on-failure
          -R '^test-halofpx-loader-partition$'

  rocmfpx-mmvq-sum-free-contract:
    name: ROCmFPX MMVQ sum-free host contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test target process guard
        run: bash tests/test-halofpx-rocmfpx-mmvq-process-guard.sh

      - name: Configure focused host tests
        run: >-
          cmake -S . -B build/ci-rocmfpx-mmvq-sum-free
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_RPC=OFF
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF

      - name: Compile both dispatch modes
        run: >-
          cmake --build build/ci-rocmfpx-mmvq-sum-free
          --target
          test-halofpx-rocmfpx-mmvq-sum-free-off
          test-halofpx-rocmfpx-mmvq-sum-free-on
          --parallel 2

      - name: Run exact host contracts
        run: >-
          ctest --test-dir build/ci-rocmfpx-mmvq-sum-free
          --output-on-failure
          -R '^test-halofpx-rocmfpx-mmvq-sum-free-(off|on)$'

  two-rank-cache-contract:
    name: CPU two-rank cache coordinator contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure isolated contract build
        run: >-
          cmake -S . -B build/ci-two-rank-cache
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_RPC=OFF
          -DGGML_RPC_HALOFPX_LOCAL_STATE=OFF
          -DLLAMA_BUILD_COMMON=ON
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_USE_PREBUILT_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF
          -DHALOFPX_CONTEXT_STORE_TWO_RANK_CONTRACT=ON

      - name: Compile isolated contract test
        run: >-
          cmake --build build/ci-two-rank-cache
          --target test-halofpx-context-store-two-rank-contract
          --parallel 2

      - name: Run coordinator behavior and source-boundary tests
        run: >-
          ctest --test-dir build/ci-two-rank-cache
          --output-on-failure
          -R '^test-halofpx-context-store-two-rank-contract(-boundary)?$'

  rocmfpx-ffn-q8-reuse-contract:
    name: ROCmFPX FFN Q8_1 reuse host contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure focused host tests
        run: >-
          cmake -S . -B build/ci-rocmfpx-ffn-q8-reuse
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_RPC=OFF
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF

      - name: Compile both selector modes
        run: >-
          cmake --build build/ci-rocmfpx-ffn-q8-reuse
          --target
          test-halofpx-rocmfpx-ffn-q8-reuse-off
          test-halofpx-rocmfpx-ffn-q8-reuse-on
          --parallel 2

      - name: Run host and source contracts
        run: >-
          ctest --test-dir build/ci-rocmfpx-ffn-q8-reuse
          --output-on-failure
          -R '^test-halofpx-rocmfpx-ffn-q8-reuse-(off|on|source-contract)$'

  prompt-cache-integrity-test:
    name: CPU prompt-cache integrity (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: scalar
            openssl_sha256: "OFF"
          - provider: openssl-evp
            openssl_sha256: "ON"
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Configure focused CPU server build
        run: >-
          cmake -S . -B build/ci-prompt-cache-integrity-${{ matrix.provider }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_RPC=ON
          -DGGML_RPC_HALOFPX_LOCAL_STATE=ON
          -DLLAMA_BUILD_COMMON=ON
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_USE_PREBUILT_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF
          -DHALOFPX_SERVER_PROMPT_CACHE_OPENSSL_SHA256=${{ matrix.openssl_sha256 }}

      - name: Compile llama-server and focused server tests
        run: >-
          cmake --build build/ci-prompt-cache-integrity-${{ matrix.provider }}
          --target llama-server test-server-prompt-cache-digest test-server-token-probabilities
          --parallel 2

      - name: Validate HaloFPX context-store feature-off runtime contract
        run: >-
          cmake
          -DHALOFPX_SERVER=${{ github.workspace }}/build/ci-prompt-cache-integrity-${{ matrix.provider }}/bin/llama-server
          -DHALOFPX_SOURCE_DIR=${{ github.workspace }}
          -DHALOFPX_CONTEXT_STORE_CANARY=OFF
          -DHALOFPX_CONTEXT_STORE_PROTECTED_CANARY=OFF
          -DHALOFPX_CONTEXT_STORE_COMPONENT_AUTHORITY=OFF
          -DHALOFPX_CONTEXT_STORE_FULL_V1_CANARY=OFF
          -DHALOFPX_CONTEXT_STORE_EXACT_KEY_CANARY=OFF
          -DHALOFPX_CONTEXT_STORE_EXACT_KEY_CATALOG_CANARY=OFF
          -P tests/test-halofpx-feature-off-contract.cmake

      - name: Run focused server CTests
        run: >-
          ctest --test-dir build/ci-prompt-cache-integrity-${{ matrix.provider }}
          --output-on-failure
          -R '^(test-server-prompt-cache-digest|test-server-token-probabilities)$'

      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest~=8.3.3 requests~=2.32.3 wget~=3.2

      - name: Prepare focused test data directory
        working-directory: tools/server/tests
        run: mkdir -p tmp

      - name: Run exact prompt-cache integrity tests
        working-directory: tools/server/tests
        env:
          LLAMA_SERVER_BIN_PATH: ${{ github.workspace }}/build/ci-prompt-cache-integrity-${{ matrix.provider }}/bin/llama-server
        run: >-
          python -m pytest -v -x
          unit/test_prompt_cache_disk.py::test_disk_only_parse_restore_and_owned_cleanup
          unit/test_prompt_cache_disk.py::test_disk_cache_round_trips_target_and_draft
          unit/test_prompt_cache_disk.py::test_disk_cache_rejects_partial_target_draft_pair
          unit/test_prompt_cache_disk.py::test_disk_cache_rejects_same_size_target_corruption
          unit/test_prompt_cache_disk.py::test_disk_cache_rejects_same_size_corruption_before_touch
          unit/test_prompt_cache_disk.py::test_failed_corrupt_entry_removal_keeps_conservative_accounting

  exact-key-restart-qualification:
    name: CPU exact-key restart qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HALOFPX_MODEL_COMMIT: 499bc8821c6b12b4e53c5bffcb21ec206f212d81
      HALOFPX_MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      HALOFPX_CANARY_MODEL: ${{ github.workspace }}/build/fixtures/stories15M-q4_0.gguf
      HALOFPX_CANARY_SERVER: ${{ github.workspace }}/build/ci-exact-key/bin/llama-server
      HALOFPX_CANARY_PORT: "18083"
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Configure focused CPU exact-key build
        run: >-
          cmake -S . -B build/ci-exact-key
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF
          -DGGML_HIP=OFF
          -DGGML_VULKAN=OFF
          -DGGML_RPC=ON
          -DGGML_RPC_HALOFPX_LOCAL_STATE=ON
          -DLLAMA_BUILD_COMMON=ON
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_WEBUI=OFF
          -DLLAMA_USE_PREBUILT_WEBUI=OFF
          -DLLAMA_OPENSSL=OFF
          -DHALOFPX_CONTEXT_STORE_CANARY=ON
          -DHALOFPX_CONTEXT_STORE_PROTECTED_CANARY=ON
          -DHALOFPX_CONTEXT_STORE_COMPONENT_AUTHORITY=ON
          -DHALOFPX_CONTEXT_STORE_FULL_V1_CANARY=ON
          -DHALOFPX_CONTEXT_STORE_EXACT_KEY_CANARY=ON
          -DHALOFPX_CONTEXT_STORE_EXACT_KEY_CATALOG_CANARY=OFF

      - name: Compile focused server and adapter test
        run: >-
          cmake --build build/ci-exact-key
          --target llama-server test-halofpx-context-store-v1-server-canary-selection
          --parallel 2

      - name: Run adapter corruption regression
        run: >-
          ctest --test-dir build/ci-exact-key
          --output-on-failure
          -R '^test-halofpx-context-store-v1-server-canary-selection$'

      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==8.3.3 requests==2.32.3

      - name: Download and verify pinned model fixture
        # Test-only, checksum-pinned external fixture; it is not redistributed.
        # Its exact conversion/license chain remains provenance-limited, so it
        # is a correctness fixture only and cannot support a release claim.
        run: |
          mkdir -p build/fixtures
          curl --fail --location --retry 3 --retry-all-errors \
            --max-filesize 19077344 \
            --proto '=https' --proto-redir '=https' \
            --output "$HALOFPX_CANARY_MODEL" \
            "https://huggingface.co/ggml-org/models-moved/resolve/${HALOFPX_MODEL_COMMIT}/tinyllamas/stories15M-q4_0.gguf?download=true"
          echo "${HALOFPX_MODEL_SHA256}  ${HALOFPX_CANARY_MODEL}" | sha256sum --check -

      - name: Validate exact-key runtime contract
        run: >-
          cmake
          -DHALOFPX_SOURCE_DIR=${{ github.workspace }}
          -DHALOFPX_CONTEXT_STORE_EXACT_KEY_CANARY=ON
          -P tests/test-halofpx-context-store-exact-key-runtime-contract.cmake

      - name: Run four-process restart qualification
        working-directory: tools/server/tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          python -m pytest -v -x
          --confcutdir=${{ github.workspace }}/tools/server/tests/unit
          unit/test_halofpx_exact_key_canary.py::test_exact_key_restart_hit_mismatch_and_corruption_recompute

      - name: Print retained failure logs
        if: failure()
        run: >-
          find "${RUNNER_TEMP}" -maxdepth 3 -type f
          \( -name '*.log' -o -name 'results.json' \)
          -print -exec tail -n 200 {} \;
