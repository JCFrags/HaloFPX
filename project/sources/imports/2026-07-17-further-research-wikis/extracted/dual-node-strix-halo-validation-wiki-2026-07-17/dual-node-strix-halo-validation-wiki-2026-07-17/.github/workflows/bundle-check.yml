name: Validation bundle checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: make check schemas synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-check-report
          path: |
            BUNDLE-CHECK-REPORT.md
            examples/synthetic-non-machine/derived/
          retention-days: 30
