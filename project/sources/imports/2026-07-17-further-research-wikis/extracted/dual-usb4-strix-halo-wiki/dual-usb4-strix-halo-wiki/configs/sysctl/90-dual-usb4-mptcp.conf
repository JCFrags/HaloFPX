# Dual direct USB4 links: permit asymmetric/multipath source validation.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# Keep MPTCP enabled and use the in-kernel path manager where available.
net.mptcp.enabled = 1
net.mptcp.path_manager = kernel
# Baseline scheduler; change only under measurement.
net.mptcp.scheduler = default
# DSS checksum is error detection, not security. Enable only when desired.
net.mptcp.checksum_enabled = 0
